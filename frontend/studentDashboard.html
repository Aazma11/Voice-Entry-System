<!-- frontend/studentDashboard.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard — EduVoice</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a class="brand" href="studentDashboard.html">
                <span class="brand-mark">E</span>
                <span class="brand-copy">
                    <strong>EduVoice</strong>
                    <span>Student workspace</span>
                </span>
            </a>
            <div class="nav-user">
                <span id="studentName"></span>
                <button onclick="logout()" class="btn-secondary">Sign out</button>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="page-intro">
            <h1>Student dashboard</h1>
            <p>Set your face profile, mark attendance, and review your records.</p>
        </div>
        <div class="dashboard-cards">
            <div class="card" onclick="window.location.href='student/profile.html'">
                <h3>👤 My Profile</h3>
                <p>View your details and set your face verification image</p>
            </div>
            <div class="card" onclick="window.location.href='student/attendance.html'">
                <h3>📍 Mark Attendance</h3>
                <p>Mark your attendance using face recognition</p>
            </div>
            <div class="card" onclick="window.location.href='student/viewAttendance.html'">
                <h3>📋 View Attendance</h3>
                <p>Check your attendance records</p>
            </div>
        </div>
    </div>

    <script src="studentApp.js"></script>
    <script>
        window.addEventListener('DOMContentLoaded', async () => {
            const token = localStorage.getItem('token');
            const role = localStorage.getItem('role');
            
            if (!token || role !== 'student') {
                window.location.href = 'studentLogin.html';
                return;
            }

            // Show cached name immediately so page never gets stuck
            const cached = localStorage.getItem('student');
            if (cached) {
                const s = JSON.parse(cached);
                document.getElementById('studentName').textContent = `Welcome, ${s.name}`;
            }

            try {
                const _port = window.location.port ? `:${window.location.port}` : '';
                const controller = new AbortController();
                setTimeout(() => controller.abort(), 8000);
                const response = await fetch(`${window.location.protocol}//${window.location.hostname}${_port}/api/student/profile`, {
                    headers: { 'Authorization': `Bearer ${token}` },
                    signal: controller.signal
                });

                if (response.ok) {
                    const data = await response.json();
                    localStorage.setItem('student', JSON.stringify(data.student));
                    document.getElementById('studentName').textContent = `Welcome, ${data.student.name}`;
                } else {
                    window.location.href = 'studentLogin.html';
                }
            } catch (error) {
                console.error('Dashboard profile fetch error:', error);
                // Don't redirect — cached name already shown above
            }
        });
    </script>
</body>
</html>
