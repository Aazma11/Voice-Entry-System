<!-- frontend/login.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Sign In — EduVoice</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <a class="brand auth-brand" href="/">
                <span class="brand-mark">E</span>
                <span class="brand-copy">
                    <strong>EduVoice</strong>
                    <span>Smart Campus Suite</span>
                </span>
            </a>
            <p class="auth-kicker">Faculty portal</p>
            <h2>Teacher sign in</h2>
            <p class="auth-lead">Voice mark entry, attendance review, and Excel export.</p>
            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <button type="submit" class="btn-primary">Sign in</button>
            </form>
            <div id="errorMessage" class="error-message"></div>
            <div class="auth-links">
                <a href="teacherRegister.html">Create a faculty account →</a>
                <a class="muted" href="studentLogin.html">Student sign in</a>
                <a class="muted" href="/">Back to home</a>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
